<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIS 2D Animation Studio</title>
<style>
body{margin:0;background:#101a35;color:white;text-align:center;font-family:Arial}
h2{color:#65c7ff}
canvas{background:#d9efff;width:95%;max-width:600px;border-radius:12px}
</style>
</head>
<body>
<h2>ALIS 2D Animation Studio</h2>
<p>हमारा पहला एनिमेशन</p>
<canvas id="scene" width="600" height="350"></canvas>
<script>
const c=document.getElementById("scene");
const ctx=c.getContext("2d");
let x=50,step=0;
  function animate(){
ctx.clearRect(0,0,600,350);

// आसमान
ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,600,350);

// जमीन
ctx.fillStyle="#55aa55";
ctx.fillRect(0,280,600,70);

// Stickman की स्थिति
    let shake=Math.sin(step*3)*0.2;
let headX=200;
   headX+=shake; 
let headY=120;
    let dance=Math.sin(step*3);
let bounce=Math.abs(Math.sin(step*3))*3;
    let reaction=Math.floor(step/20)%3;
let jump=(reaction===2)?Math.abs(Math.sin(step*5))*18:0;
    
    

// सिर
ctx.strokeStyle="#111";
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(headX,headY+bounce-jump,25,0,Math.PI*2);
ctx.stroke();
    let mouthSize=6+Math.abs(Math.sin(step*2))*3;
let laugh=reaction===0;
    let scared=reaction===2;
    let blink=(step%35>33)?0.15:1;
// हैरानी वाली बड़ी आँखें
ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(headX-8,headY+bounce-jump-5,(scared?10:(reaction===1?8:6))*blink,0,Math.PI*2);
ctx.arc(headX+8,headY+bounce-jump-5,(scared?10:(reaction===1?8:6))*blink,0,Math.PI*2);
ctx.fill();

// गुस्से और डर वाली भौंहें
ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.beginPath();

ctx.moveTo(headX-15,headY+bounce-jump-(scared?20:14));
ctx.lineTo(headX-3,headY+bounce-9);

ctx.moveTo(headX+15,headY+bounce-jump-(scared?20:14));
ctx.lineTo(headX+3,headY+bounce-9);

ctx.stroke();
    let eyeMove=Math.sin(step*2)*2;
    if(scared){
ctx.fillStyle="#00aaff";
ctx.beginPath();
ctx.arc(headX+29,headY+bounce-12+Math.sin(step*8)*4,4,0,Math.PI*2);
ctx.fill();
    }

// आँखों की पुतलियाँ
ctx.fillStyle="#111";
ctx.globalAlpha=blink;
ctx.beginPath();
ctx.arc(headX-8+eyeMove,headY+bounce-5,3,0,Math.PI*2);
ctx.arc(headX+8+eyeMove,headY+bounce-5,3,0,Math.PI*2);
ctx.fill();
    ctx.globalAlpha=1;

// हँसने और हैरान होने वाला मुँह

ctx.fillStyle="#111";
ctx.beginPath();

if(laugh){
ctx.ellipse(headX,headY+bounce+9,10,5,0,0,Math.PI*2);
}else{
ctx.ellipse(headX,headY+bounce+10,mouthSize,mouthSize+2,0,0,Math.PI*2);
}

ctx.fill();



// शरीर
ctx.beginPath();
ctx.moveTo(headX,145+bounce);
ctx.lineTo(headX,220+bounce);
ctx.stroke();

// हाथों का डांस
    let armShake=Math.sin(step*3)*1;
ctx.beginPath();
ctx.lineWidth=5;

ctx.moveTo(headX,160);
ctx.lineTo(headX-35+armShake,175+dance*30);

ctx.moveTo(headX,160);
ctx.lineTo(headX+35-armShake,175-dance*30);

ctx.stroke();

// बिना क्रॉस किए पैरों का डांस
ctx.beginPath();
ctx.lineWidth=6;

let swingLeg=Math.sin(step*3)*12;
let liftLeft=Math.max(0,dance)*18;
let liftRight=Math.max(0,-dance)*18;

// बायाँ पैर
ctx.moveTo(headX-5,220+bounce);
ctx.lineTo(headX-20,245+bounce-liftLeft);
ctx.lineTo(headX-20+swingLeg,270-liftLeft);

// दायाँ पैर
ctx.moveTo(headX+5,220+bounce);
ctx.lineTo(headX+20,245+bounce-liftRight);
ctx.lineTo(headX+20-swingLeg,270-liftRight);

ctx.stroke();

step+=0.12;
requestAnimationFrame(animate);
}
animate();

</script>
</body>
</html>
