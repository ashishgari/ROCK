<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIS 2D Animation Studio</title>
<style>
body{margin:0;background:#101a35;color:white;text-align:center;font-family:Arial}
h2{color:#65c7ff}
canvas{background:#d9efff;width:95%;max-width:600px;border-radius:12px}
</style>
</head>
<body>
<h2>ALIS 2D Animation Studio</h2>
<p>हमारा पहला एनिमेशन</p>
<canvas id="scene" width="600" height="350"></canvas>
<script>
const c=document.getElementById("scene");
const ctx=c.getContext("2d");
let x=50,step=0;
  function animate(){
ctx.clearRect(0,0,600,350);

// आसमान
ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,600,350);

// जमीन
ctx.fillStyle="#55aa55";
ctx.fillRect(0,280,600,70);

// Stickman की स्थिति
let headX=200;
let headY=120;
    let dance=Math.sin(step*3);
let bounce=Math.abs(Math.sin(step*3))*12;
    

// सिर
ctx.strokeStyle="#111";
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(headX,headY+bounce,25,0,Math.PI*2);
ctx.stroke();

// हैरानी वाली बड़ी आँखें
ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(headX-8,headY-5,6,0,Math.PI*2);
ctx.arc(headX+8,headY-5,6,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#111";
ctx.beginPath();
ctx.arc(headX-8,headY-5,3,0,Math.PI*2);
ctx.arc(headX+8,headY-5,3,0,Math.PI*2);
ctx.fill();
    // हैरानी में खुला मुँह
ctx.fillStyle="#111";
ctx.beginPath();
ctx.ellipse(headX,headY+9,6,9,0,0,Math.PI*2);
ctx.fill();

// शरीर
ctx.beginPath();
ctx.moveTo(headX,145+bounce);
ctx.lineTo(headX,220+bounce);
ctx.stroke();

// हाथों का डांस
ctx.beginPath();
ctx.lineWidth=5;

ctx.moveTo(headX,160);
ctx.lineTo(headX-35,175+dance*30);

ctx.moveTo(headX,160);
ctx.lineTo(headX+35,175-dance*30);

ctx.stroke();

// बिना क्रॉस किए पैरों का डांस
ctx.beginPath();
ctx.lineWidth=6;

let swingLeg=Math.sin(step*3)*12;
let liftLeft=Math.max(0,dance)*18;
let liftRight=Math.max(0,-dance)*18;

// बायाँ पैर
ctx.moveTo(headX-5,220+bounce);
ctx.lineTo(headX-20,245+bounce-liftLeft);
ctx.lineTo(headX-20+swingLeg,270-liftLeft);

// दायाँ पैर
ctx.moveTo(headX+5,220+bounce);
ctx.lineTo(headX+20,245+bounce-liftRight);
ctx.lineTo(headX+20-swingLeg,270-liftRight);

ctx.stroke();

step+=0.12;
requestAnimationFrame(animate);
}
animate();

</script>
</body>
</html>
