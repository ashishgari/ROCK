<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIS 2D Animation Studio</title>
<style>
body{margin:0;background:#101a35;color:white;text-align:center;font-family:Arial}
h2{color:#65c7ff}
canvas{background:#d9efff;width:95%;max-width:600px;border-radius:12px}
</style>
</head>
<body>
<h2>ALIS 2D Animation Studio</h2>
<p>हमारा पहला एनिमेशन</p>
<canvas id="scene" width="600" height="350"></canvas>
<script>
const c=document.getElementById("scene");
const ctx=c.getContext("2d");
let x=50,step=0;
  function animate(){
ctx.clearRect(0,0,600,350);
    let fallPhase=step%160;
let fall=fallPhase<35?0:fallPhase<42?Math.sin((fallPhase-35)/7*Math.PI/2):fallPhase<50?1:fallPhase<55?1-0.9*Math.sin((fallPhase-50)/5*Math.PI/2):fallPhase<60?0.1+0.9*Math.sin((fallPhase-55)/5*Math.PI/2):fallPhase<70?1:fallPhase<78?Math.cos((fallPhase-70)/8*Math.PI/2):0;
    let turnPhase=fallPhase>=130&&fallPhase<145;
let turnProgress=turnPhase?(fallPhase-130)/15:0;
let turnFace=fallPhase>=145?1:turnProgress;

let comedyWalk=fallPhase>=145&&fallPhase<160;
let walkMove=comedyWalk?Math.sin(step*2)*2:0;
// आसमान
ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,600,350);

// जमीन
ctx.fillStyle="#55aa55";
ctx.fillRect(0,280,600,70);

// Stickman की स्थिति
    let shake=Math.sin(step*3)*0.2;
let headX=200;
    let slipMove=(step%100>40&&step%100<55)?Math.sin((step%100-40)/15*Math.PI)*25:0;
   headX+=shake; 
    headX+=slipMove;
    headX+=walkMove;
    
let headY=120;
    let calmStand=fallPhase>=78&&fallPhase<130;
let dance=comedyWalk?-Math.sin(step*2)*0.6:calmStand?0:Math.sin(step*3);
let bounce=calmStand?0:Math.abs(Math.sin(step*3))*3;
    let reaction=Math.floor(step/20)%3;
let jump=(reaction===2)?Math.abs(Math.sin(step*0.5))*4:0;
    ctx.save();
ctx.translate(headX,220+bounce);
ctx.rotate(fall*Math.PI/2);
    
    ctx.scale(1,1);
    ctx.translate(-headX,-220);
    
    

// सिर
ctx.strokeStyle="#111";
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(headX,headY+bounce-jump,25,0,Math.PI*2);
ctx.stroke();
    let mouthSize=6+Math.abs(Math.sin(step*2))*3;
let laugh=reaction===0;
    let scared=reaction===2;
    let blink=(step%35>33)?0.15:1;
    let eyeMove=(fallPhase>=114&&fallPhase<130)
?Math.sin(step*1.5)*3
:(reaction===2?0:Math.sin(step*2)*2)+(fall>0.9?Math.sin(step*2)*2:0);
// हैरानी वाली बड़ी आँखें
ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(headX-8+eyeMove+turnFace*15,headY+bounce-jump+(reaction===2?5:0)-5,(scared?10:(reaction===1?8:6))*blink,0,Math.PI*2);

ctx.arc(headX+8+eyeMove-turnFace*8,headY+bounce-jump+(reaction===2?5:0)-5,(scared?10:(reaction===1?8:6))*blink*(1-turnFace*0.95),0,Math.PI*2);
ctx.fill();

// गुस्से और डर वाली भौंहें
ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.beginPath();

ctx.moveTo(headX-15+turnFace*15,headY+bounce-jump+(reaction===2?5:0)-(scared?20:14));
ctx.lineTo(headX-3+turnFace*15,headY+bounce-jump+(reaction===2?5:0)-9);
ctx.moveTo(headX+15-turnFace*8,headY+bounce-jump+(reaction===2?5:0)-(scared?20:14));
ctx.lineTo(headX+3-turnFace*8,headY+bounce-jump+(reaction===2?5:0)-9);
ctx.stroke();
    
    
    if(scared){
ctx.fillStyle="#00aaff";
ctx.beginPath();
ctx.arc(headX+29,headY+bounce-jump-12+Math.sin(step*8)*4,4,0,Math.PI*2);
ctx.fill();
    }

// आँखों की पुतलियाँ
ctx.fillStyle="#111";
ctx.globalAlpha=blink;
ctx.beginPath();
ctx.arc(headX-8+eyeMove+turnFace*15,headY+bounce-jump+(reaction===2?5:0)-5,2,0,Math.PI*2);

ctx.arc(headX+8+eyeMove-turnFace*8,headY+bounce-jump+(reaction===2?5:0)-5,2*(1-turnFace*0.95),0,Math.PI*2);
ctx.fill();
    ctx.globalAlpha=1;

// हँसने और हैरान होने वाला मुँह
// साइड में नाक का संकेत
if(turnFace>0.5){
ctx.fillStyle="#111";
ctx.beginPath();
ctx.arc(headX+17,headY+bounce-jump+3,2,0,Math.PI*2);
ctx.fill();
}
ctx.fillStyle="#111";
ctx.beginPath();

if(laugh){
ctx.ellipse(headX+turnFace*10,headY+bounce-jump+(reaction===2?5:0)+9,8*(1-turnFace*0.2),5,0,0,Math.PI*2);
}else{
ctx.ellipse(headX+turnFace*10,headY+bounce-jump +(reaction===2?5:0)+10,mouthSize*(1-turnFace*0.4),mouthSize+2,0,0,Math.PI*2);
}

ctx.fill();



// शरीर और कमर का टर्न
let bodyTurn=turnFace*8;

ctx.beginPath();
ctx.moveTo(headX+bodyTurn,145+bounce);
ctx.lineTo(headX,220+bounce);
ctx.stroke();
// हाथों का डांस और साइड टर्न
let armShake=comedyWalk?Math.sin(step*2)*12:Math.sin(step*3)*1;
let walkArm=comedyWalk?Math.sin(step*2)*18:0;
let armSlip=(step%100>40&&step%100<55)?Math.sin((step%100-40)/15*Math.PI):0;

let armTurn=turnFace*18;

ctx.beginPath();
ctx.lineWidth=5;

ctx.moveTo(headX+bodyTurn,160);
ctx.lineTo(headX-35+armShake+walkArm-armSlip*20+armTurn,175+walkArm-armSlip*20);

ctx.moveTo(headX+bodyTurn,160);
ctx.lineTo(headX+35-armShake-walkArm+armSlip*20-armTurn,175-walkArm-armSlip*20);

ctx.stroke();

// बिना क्रॉस किए पैरों का डांस
ctx.beginPath();
ctx.lineWidth=6;

    
let swingLeg=calmStand?0:comedyWalk?Math.sin(step*2)*10:Math.sin(step*3)*12;
let liftLeft=calmStand?0:comedyWalk?Math.max(0,Math.sin(step*2))*12:Math.max(0,dance)*18;
let liftRight=calmStand?0:comedyWalk?Math.max(0,-Math.sin(step*2))*12:Math.max(0,-dance)*18;
    let slipPhase=step%100;
let slip=(slipPhase>40&&slipPhase<55)?Math.sin((slipPhase-40)/15*Math.PI):0;

// पैर और साइड टर्न
let legTurn=turnFace;

ctx.beginPath();
ctx.lineWidth=6;

// बायाँ पैर
ctx.moveTo(headX-5+legTurn*5,220+bounce);
ctx.lineTo(headX-20+legTurn*15,245+bounce-liftLeft);
ctx.lineTo(headX-20+swingLeg-slip*25+legTurn*15,270-liftLeft);

// दायाँ पैर
ctx.moveTo(headX+5-legTurn*5,220+bounce);
ctx.lineTo(headX+20-legTurn*15,245+bounce-liftRight);
ctx.lineTo(headX+20-swingLeg+slip*25-legTurn*15,270-liftRight);

ctx.stroke();
ctx.restore();
step+=0.12;
requestAnimationFrame(animate);
}
animate();

</script>
</body>
</html>
