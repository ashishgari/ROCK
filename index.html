<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIS Voice Assistant</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #071018;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.container {
  max-width: 520px;
  margin: 30px auto;
  padding: 25px;
  background: #102231;
  border-radius: 20px;
}
h1 { color: #55d6ff; font-size: 38px; }
p { line-height: 1.6; }
button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #00a8e8;
  color: white;
  font-size: 17px;
}
button:active { background: #0077aa; }
#status {
  color: #8feaff;
  overflow-wrap: anywhere;
}
#answer {
  margin-top: 20px;
  padding: 12px;
  background: #071018;
  border-radius: 12px;
  min-height: 45px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">
  <h1>ALIS</h1>
  <p>आपका हिंदी वॉइस असिस्टेंट</p>

  <button id="listenBtn">🎙️ बोलिए — ALIS सुन रहा है</button>
  <button id="stopBtn">⏹️ आवाज़ बंद करें</button>

  <p id="status">शुरू करने के लिए बटन दबाएँ।</p>
  <div id="answer">नमस्ते! मैं ALIS हूँ।</div>
</div>

<script>
const statusBox = document.getElementById("status");
const answerBox = document.getElementById("answer");
const listenBtn = document.getElementById("listenBtn");
const stopBtn = document.getElementById("stopBtn");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let listening = false;
let speaking = false;

function speak(text) {
  answerBox.textContent = text;

  if (!("speechSynthesis" in window)) {
    statusBox.textContent = "आपका ब्राउज़र आवाज़ में जवाब नहीं दे सकता।";
    return;
  }

  speaking = true;
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "hi-IN";
  utterance.rate = 0.95;
  utterance.pitch = 1;

  utterance.onend = () => {
    speaking = false;
  };

  utterance.onerror = () => {
    speaking = false;
  };

  window.speechSynthesis.speak(utterance);
}

function getDayName(date) {
  const days = [
    "रविवार", "सोमवार", "मंगलवार", "बुधवार",
    "गुरुवार", "शुक्रवार", "शनिवार"
  ];
  return days[date.getDay()];
}

function getDateText() {
  const now = new Date();
  const months = [
    "जनवरी", "फ़रवरी", "मार्च", "अप्रैल",
    "मई", "जून", "जुलाई", "अगस्त",
    "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"
  ];

  return `आज ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} है।`;
}

function calculate(text) {
    let s = text.toLowerCase()
    .replace(/एलिस/g, "")
    .replace(/alis/gi, "")
    .replace(/कितने होते हैं/g, "")
    .replace(/कितने होते है/g, "")
    .replace(/×/g, "*")
    .replace(/x/g, "*")
    .replace(/÷/g, "/")
    .replace(/plus/g, "+")
    .replace(/minus/g, "-")
    .replace(/into/g, "*")
    .replace(/multiplied by/g, "*")
    .replace(/divided by/g, "/")
    .replace(/जमा/g, "+")
    .replace(/जोड़ो/g, "+")
    .replace(/जोड़/g, "+")
    .replace(/प्लस/g, "+")
    .replace(/घटाओ/g, "-")
    .replace(/घटा/g, "-")
    .replace(/माइनस/g, "-")
    .replace(/गुणा/g, "*")
    .replace(/गुना/g, "*")
    .replace(/भाग/g, "/")
    .replace(/बटा/g, "/")
    .replace(/कितना होता है/g, "")
    .replace(/कितना है/g, "")
    .replace(/कितना होगा/g, "")
    .replace(/का/g, "")
    .replace(/है/g, "")
    .replace(/बताओ/g, "")
    .replace(/कैलकुलेट/g, "")
    .replace(/[?=]/g, " ")
    .trim();

// Sin और Cos की गणना डिग्री में
const trigMatch = s.match(
  /\b(sin|sine|sun|cos|cosine)\s*(\d+(?:\.\d+)?)/i
) || s.match(
  /(साइन|सिन|कोस|कॉस)\s*(\d+(?:\.\d+)?)/
);

if (trigMatch) {
  const fn = trigMatch[1].toLowerCase();
  const angle = Number(trigMatch[2]);
  const radians = angle * Math.PI / 180;

  const isSin = ["sin", "sine", "sun", "साइन", "सिन"].includes(fn);

  const answer = isSin
    ? Math.sin(radians)
    : Math.cos(radians);

  return Number(answer.toFixed(8)).toString();
}

  const words = {
    "शून्य":"0", "एक":"1", "दो":"2", "तीन":"3",
    "चार":"4", "पाँच":"5", "पांच":"5", "छह":"6",
    "सात":"7", "आठ":"8", "नौ":"9", "दस":"10",
    "ग्यारह":"11", "बारह":"12", "तेरह":"13",
    "चौदह":"14", "पंद्रह":"15", "सोलह":"16",
    "सत्रह":"17", "अठारह":"18", "उन्नीस":"19",
    "बीस":"20", "तीस":"30", "चालीस":"40",
    "पचास":"50", "सौ":"100"
  };

  for (const [word, number] of Object.entries(words)) {
    s = s.replaceAll(word, number);
  }

  // गणना केवल सुरक्षित अंक और गणितीय चिह्नों से करें।
  if (!/^[\d\s.+*/()-]+$/.test(s)) return null;

  const parts = s.match(/(?:\d+(?:\.\d+)?|[()+*/-])/g);
  if (!parts || parts.join("") !== s.replace(/\s/g, "")) return null;

  try {
    let i = 0;

    function expression() {
      let value = term();
      while (parts[i] === "+" || parts[i] === "-") {
        const op = parts[i++];
        const right = term();
        value = op === "+" ? value + right : value - right;
      }
      return value;
    }

    function term() {
      let value = factor();
      while (parts[i] === "*" || parts[i] === "/") {
        const op = parts[i++];
        const right = factor();
        if (op === "/" && right === 0) throw Error("शून्य से भाग नहीं दे सकते।");
        value = op === "*" ? value * right : value / right;
      }
      return value;
    }

    function factor() {
      if (parts[i] === "-") {
        i++;
        return -factor();
      }
      if (parts[i] === "(") {
        i++;
        const value = expression();
        if (parts[i++] !== ")") throw Error();
        return value;
      }
      const value = Number(parts[i++]);
      if (!Number.isFinite(value)) throw Error();
      return value;
    }

    const result = expression();
    if (i !== parts.length || !Number.isFinite(result)) return null;
    return Number(result.toFixed(8)).toString();
  } catch (e) {
    if (e.message === "शून्य से भाग नहीं दे सकते।") throw e;
    return null;
  }
}

function runCommand(raw) {
  const text = raw.toLowerCase()
    .replace(/[।,!?]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (!text) {
    speak("मुझे आपकी बात सुनाई नहीं दी। कृपया फिर से बोलिए।");
    return;
  }

  if (text.includes("good morning") || text.includes("सुप्रभात") || text.includes("गुड मॉर्निंग") || text.includes("एलिस गुड मॉर्निंग")) {
    speak("गुड मॉर्निंग! आपका दिन शुभ हो। मैं ALIS हूँ। बताइए, मैं आपकी क्या मदद करूँ?");
    return;
  }

  if (text.includes("good evening") || text.includes("शुभ संध्या")) {
    speak("गुड ईवनिंग! आपका स्वागत है। बताइए, मैं आपकी क्या मदद करूँ?");
    return;
  }

  if (text.includes("good night") || text.includes("शुभ रात्रि")) {
    speak("गुड नाइट! आपका दिन अच्छा बीते और रात आरामदायक हो।");
    return;
  }

  if (text.includes("नमस्ते") || text.includes("नमस्कार") ||
      text.includes("hello") || text.includes("hi ")) {
    speak("नमस्ते! मैं ALIS हूँ। बताइए, मैं आपकी क्या मदद करूँ?");
    return;
  }

  if (text.includes("तुम क्या कर सकते हो") ||
      text.includes("क्या कर सकते हो") ||
      text.includes("what can you do")) {
    speak("मैं समय और तारीख बता सकता हूँ, सप्ताह का दिन बता सकता हूँ, आसान गणित कर सकता हूँ और Google या YouTube खोलने की कोशिश कर सकता हूँ।");
    return;
  }

  if (text.includes("आज कौन") && text.includes("दिन") ||
      text.includes("कौन सा दिन") ||
      text.includes("कौन-सा दिन") ||
      text.includes("which day")) {
    speak("आज " + getDayName(new Date()) + " है।");
    return;
  }

  if (text.includes("तारीख") || text.includes("date") ||
      text.includes("आज की डेट")) {
    speak(getDateText());
    return;
  }

  if (text.includes("समय") || text.includes("कितने बजे") ||
      text.includes("कितना बज") || text.includes("time")) {
    speak("अभी समय है " + new Date().toLocaleTimeString("hi-IN", {
      hour: "numeric", minute: "2-digit"
    }));
    return;
  }

  if (text.includes("google") || text.includes("गूगल")) {
    speak("Google खोलने की कोशिश कर रहा हूँ।");
    setTimeout(() => {
      window.location.href =
        "intent://www.google.com/#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
    }, 700);
    return;
  }

  if (text.includes("youtube") || text.includes("यूट्यूब")) {
    speak("YouTube खोलने की कोशिश कर रहा हूँ।");
    setTimeout(() => {
      window.location.href =
        "intent://www.youtube.com/#Intent;scheme=https;package=com.google.android.youtube;end";
    }, 700);
    return;
  }

  try {
    const result = calculate(text);
    if (result !== null) {
      speak("जवाब है " + result);
      return;
    }
  } catch (e) {
    speak(e.message);
    return;
  }

  speak("माफ़ कीजिए, मैं यह सवाल अभी नहीं समझ पाया। आप समय, तारीख, सप्ताह के दिन या गणित का सवाल पूछ सकते हैं।");
}

function startListening() {
  if (!SpeechRecognition) {
    speak("आपके ब्राउज़र में आवाज़ पहचानने की सुविधा उपलब्ध नहीं है। कृपया Chrome में खोलें।");
    return;
  }

  if (recognition) {
    try { recognition.abort(); } catch (e) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    listening = true;
    statusBox.textContent = "सुन रहा हूँ… अब बोलिए।";
    listenBtn.textContent = "🎙️ सुन रहा हूँ…";
  };

  recognition.onresult = (event) => {
    const alternatives = Array.from(event.results[0]);
    const transcript = alternatives[0].transcript;
    statusBox.textContent = "आपने कहा: " + transcript;
    runCommand(transcript);
  };

  recognition.onerror = (event) => {
    listening = false;
    listenBtn.textContent = "🎙️ बोलिए — ALIS सुन रहा है";
    statusBox.textContent = "आवाज़ पहचानने में समस्या: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    listenBtn.textContent = "🎙️ बोलिए — ALIS सुन रहा है";
  };

  try {
    recognition.start();
  } catch (e) {
    statusBox.textContent = "दोबारा शुरू करने से पहले कुछ क्षण रुकिए।";
  }
}

listenBtn.addEventListener("click", startListening);

stopBtn.addEventListener("click", () => {
  if (recognition) {
    try { recognition.abort(); } catch (e) {}
  }
  window.speechSynthesis.cancel();
  listening = false;
  speaking = false;
  statusBox.textContent = "आवाज़ बंद है।";
  listenBtn.textContent = "🎙️ बोलिए — ALIS सुन रहा है";
});

</script>
</body>
</html>
