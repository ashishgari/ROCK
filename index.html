<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIS Voice Assistant</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #071018;
  color: #eef7ff;
  font-family: Arial, sans-serif;
}

.app {
  width: 92%;
  max-width: 520px;
  padding: 24px;
  border: 1px solid #294154;
  border-radius: 24px;
  background: #0c1720;
}

h1 {
  text-align: center;
  font-size: 42px;
  letter-spacing: 5px;
  margin-bottom: 5px;
}

.sub {
  text-align: center;
  color: #9fb3c2;
}

.orb {
  width: 140px;
  height: 140px;
  margin: 25px auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 42px;
  font-weight: bold;
  background: radial-gradient(circle, #183e55, #08131b);
  border: 2px solid #36b8ff;
}

.listening {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.05); }
}

select, input, button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #385366;
  background: #101f2a;
  color: white;
  font-size: 16px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: #126c9e;
}

.stop {
  background: #7b2731;
}

#status {
  margin-top: 18px;
  min-height: 40px;
  color: #b9d9e8;
}

#log {
  white-space: pre-wrap;
  padding: 12px;
  background: #071119;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<main class="app">

<h1>ALIS</h1>
<div class="sub">Hindi Voice Assistant</div>

<div id="orb" class="orb">A</div>

<select id="language">
  <option value="hi-IN">हिन्दी</option>
  <option value="en-US">English</option>
</select>

<input id="command"
       placeholder="कमांड लिखें या बोलें">

<div class="row">
  <button class="primary" id="ask">ALIS से पूछें</button>
  <button id="listen">🎙️ बोलिए</button>
</div>

<button class="stop" id="stop">रोकें</button>

<div id="status">नमस्ते! मैं ALIS हूँ।</div>
<div id="log">ALIS: मैं आपकी मदद के लिए तैयार हूँ।</div>

<p>
उदाहरण: समय बताओ, तारीख बताओ,
Google खोलो, YouTube खोलो।
</p>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const lang = $("language");
  const input = $("command");
  const status = $("status");
  const log = $("log");
  const orb = $("orb");

  let recognition = null;

  function clean(text) {
    return text.toLowerCase().trim();
  }

  function say(text) {
    if (!("speechSynthesis" in window)) {
      status.textContent = text;
      return;
    }

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);
    voice.lang = lang.value;
    voice.rate = 0.95;

    speechSynthesis.speak(voice);
  }

  function show(command, reply) {
    log.textContent =
      "आप: " + command + "\nALIS: " + reply;

    status.textContent = reply;
  }

  function openApp(app) {
    let intentURL = "";

    if (app === "youtube") {
      intentURL =
        "intent://www.youtube.com/#Intent;" +
        "scheme=https;" +
        "package=com.google.android.youtube;" +
        "S.browser_fallback_url=https%3A%2F%2Fwww.youtube.com%2F;" +
        "end";
    } else if (app === "google") {
      intentURL =
        "intent://www.google.com/#Intent;" +
        "scheme=https;" +
        "package=com.google.android.googlequicksearchbox;" +
        "S.browser_fallback_url=https%3A%2F%2Fwww.google.com%2F;" +
        "end";
    }

    if (!intentURL) return;

    // ऐप खोलने की कोशिश सीधे यूज़र के कमांड पर होगी।
    window.location.href = intentURL;
  }

  function runCommand(raw) {
    const q = clean(raw);

    if (!q) return;

    let reply = "";

    if (
      /(youtube|यूट्यूब)/i.test(q) &&
      /(खोल|open|chalao|चलाओ)/i.test(q)
    ) {
      reply = lang.value === "hi-IN"
        ? "YouTube ऐप खोलने की कोशिश कर रहा हूँ।"
        : "Trying to open YouTube.";

      show(raw, reply);
      say(reply);
      openApp("youtube");
      return;
    }

    if (
      /(google|गूगल)/i.test(q) &&
      /(खोल|open|chalao|चलाओ)/i.test(q)
    ) {
      reply = lang.value === "hi-IN"
        ? "Google ऐप खोलने की कोशिश कर रहा हूँ।"
        : "Trying to open Google.";

      show(raw, reply);
      say(reply);
      openApp("google");
      return;
    }

    if (
      /(समय|टाइम|time|what time)/i.test(q)
    ) {
      const now = new Date();

      reply = lang.value === "hi-IN"
        ? "अभी समय " +
          now.toLocaleTimeString("hi-IN", {
            hour: "2-digit",
            minute: "2-digit"
          }) + " है।"
        : "The time is " +
          now.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit"
          });

    } else if (
      /(तारीख|डेट|date|today)/i.test(q)
    ) {
      reply = lang.value === "hi-IN"
        ? "आज " +
          new Date().toLocaleDateString("hi-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
          }) + " है।"
        : "Today is " +
          new Date().toLocaleDateString("en-US");

    } else if (
      /(नमस्ते|हेलो|hello|hi|hey)/i.test(q)
    ) {
      reply = lang.value === "hi-IN"
        ? "नमस्ते! मैं ALIS हूँ। बताइए, आपकी क्या मदद करूँ?"
        : "Hello! I am ALIS. How can I help you?";

    } else if (
      /(रुको|बंद|चुप|stop)/i.test(q)
    ) {
      speechSynthesis.cancel();
      reply = lang.value === "hi-IN"
        ? "ठीक है, मैंने बोलना रोक दिया।"
        : "Okay, I stopped speaking.";

    } else {
      reply = lang.value === "hi-IN"
        ? "माफ़ कीजिए, यह कमांड अभी मुझे समझ नहीं आई।"
        : "Sorry, I did not understand that command.";
    }

    show(raw, reply);
    say(reply);
  }

  $("ask").onclick = () => runCommand(input.value);

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      runCommand(input.value);
    }
  });

  $("listen").onclick = () => {
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      status.textContent =
        "इस ब्राउज़र में आवाज़ पहचानने की सुविधा उपलब्ध नहीं है।";
      return;
    }

    if (recognition) {
      try { recognition.abort(); } catch (e) {}
    }

    recognition = new SpeechRecognition();
    recognition.lang = lang.value;
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      orb.classList.add("listening");
      status.textContent = "ALIS सुन रहा है...";
    };

    recognition.onresult = event => {
      const spoken = event.results[0][0].transcript;
      input.value = spoken;
      runCommand(spoken);
    };

    recognition.onerror = event => {
      status.textContent =
        "माइक्रोफ़ोन समस्या: " + event.error;
    };

    recognition.onend = () => {
      orb.classList.remove("listening");
    };

    try {
      recognition.start();
    } catch (e) {
      status.textContent =
        "माइक्रोफ़ोन शुरू नहीं हो सका।";
    }
  };

  $("stop").onclick = () => {
    if (recognition) {
      try { recognition.abort(); } catch (e) {}
    }

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }

    orb.classList.remove("listening");
    status.textContent = "ALIS रुक गया है।";
  };

  lang.onchange = () => {
    status.textContent =
      lang.value === "hi-IN"
        ? "हिन्दी मोड तैयार है।"
        : "English mode ready.";
  };
})();
</script>
</main>
</body>
</html>
