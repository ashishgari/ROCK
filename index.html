<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIS Voice Assistant</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 14px;
  min-height: 100vh;
  background: radial-gradient(circle, #18264b, #070b18);
  color: #f8f5ff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: 18px auto;
  padding: 24px 20px;
  background: #10172c;
  border: 1px solid #35436c;
  border-radius: 22px;
}

h1 { letter-spacing: 5px; }
p { color: #c9c7e6; line-height: 1.6; }

button, select {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: 0;
  background: #7868f5;
  color: white;
  font-weight: bold;
}

button:active { transform: scale(.98); }
#stopBtn { background: #a83f59; }

select {
  background: #202a46;
  color: white;
  border: 1px solid #53638e;
}

#alisOrb {
  width: 170px;
  height: 170px;
  margin: 25px auto;
  border-radius: 50%;
  position: relative;
  background:
    radial-gradient(circle,
      #ffffff 0%,
      #8df7ff 8%,
      #218dff 22%,
      #102b70 48%,
      #050b20 70%);
  border: 2px solid #72eaff;
  box-shadow:
    0 0 15px #00d9ff,
    0 0 35px #1678ff,
    inset 0 0 25px #42cfff;
  transition: transform .3s, box-shadow .3s;
}

#alisOrb::before,
#alisOrb::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: #50f5ff;
  border-bottom-color: #536cff;
  animation: orbSpin 4s linear infinite;
}

#alisOrb::after {
  inset: -22px;
  border-top-color: #8b7bff;
  border-bottom-color: #00d9ff;
  animation-duration: 7s;
  animation-direction: reverse;
}

@keyframes orbSpin {
  to { transform: rotate(360deg); }
}

#alisOrb.listening {
  transform: scale(1.08);
  background: radial-gradient(circle,
    #ffffff 0%,
    #e0ffff 10%,
    #00eaff 25%,
    #087cff 50%,
    #050b20 75%);
  box-shadow:
    0 0 25px #66e5ff,
    0 0 60px #168bff,
    inset 0 0 40px #00eaff;
}

#alisOrb.speaking {
  transform: scale(1.12);
  background: radial-gradient(circle,
    #ffffff 0%,
    #f2ddff 10%,
    #c879ff 25%,
    #7250ff 50%,
    #050b20 75%);
  box-shadow:
    0 0 30px #bd79ff,
    0 0 70px #7250ff,
    inset 0 0 40px #bd79ff;
}


#status, #answer {
  overflow-wrap: anywhere;
  margin-top: 16px;
}

#answer {
  padding: 14px;
  border-radius: 12px;
  background: #1a2340;
}
  #listenBtn,
#stopBtn,
#voiceSelect,
#previewVoiceBtn,
#status,
#answer,
.container > p {
  display: none;
}
</style>
</head>

<body>
<div class="container">
  <h1>ALIS</h1>
<div id="alisOrb"></div>
  <p>आपका हिंदी वॉइस असिस्टेंट</p>

  <button id="listenBtn">🎙️ बोलिए — ALIS सुन रहा है</button>
  <button id="stopBtn">⏹️ आवाज़ बंद करें</button>

  <p>🎙️ ALIS की आवाज़ चुनें</p>
  <select id="voiceSelect">
    <option value="">आवाज़ें लोड हो रही हैं...</option>
  </select>
  <button id="previewVoiceBtn">🔊 आवाज़ सुनें</button>

  <p id="status">शुरू करने के लिए बटन दबाएँ।</p>
  <div id="answer">नमस्ते! मैं ALIS हूँ।</div>
</div>

<script>
"use strict";
  const ALIS_API_URL = "https://script.google.com/macros/s/AKfycbzDbb_SGoQgiZYPAgH6uejnlK4UD9rRTykqu5uUjkAgI93qZ7wZuzAzH_D7xyLAqodanQ/exec";

const statusBox = document.getElementById("status");
const answerBox = document.getElementById("answer");
const listenBtn = document.getElementById("listenBtn");
const stopBtn = document.getElementById("stopBtn");
const voiceSelect = document.getElementById("voiceSelect");
const previewVoiceBtn = document.getElementById("previewVoiceBtn");
const orb = document.getElementById("alisOrb");
  function askAlisAI(question) {
  const callbackName = "alisCallback";

  window.alisCallback = function(data) {
    const answer = data.answer || "अभी जवाब नहीं मिला।";
    answerBox.textContent = answer;
    speak(answer);
  };

  const script = document.createElement("script");
  script.src = ALIS_API_URL +
    "?question=" + encodeURIComponent(question) +
    "&callback=" + callbackName;

  script.onerror = function() {
    answerBox.textContent = "ALIS इंटरनेट से नहीं जुड़ पाया।";
    speak("इंटरनेट से जुड़ने में समस्या हुई।");
  };

  document.body.appendChild(script);
  }

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let listening = false;
let speaking = false;
let availableVoices = [];
let autoListen = true;

function loadVoices() {
  if (!("speechSynthesis" in window)) {
    voiceSelect.innerHTML =
      '<option value="">ब्राउज़र में आवाज़ उपलब्ध नहीं</option>';
    return;
  }
  
  availableVoices = window.speechSynthesis.getVoices();
  voiceSelect.innerHTML = "";

  if (!availableVoices.length) {
    voiceSelect.innerHTML =
      '<option value="">अभी आवाज़ें उपलब्ध नहीं हैं</option>';
    return;
  }

  availableVoices.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = `${voice.name} (${voice.lang})`;
    voiceSelect.appendChild(option);
  });

  const hindiIndex = availableVoices.findIndex(v =>
    v.lang.toLowerCase().startsWith("hi")
  );

  if (hindiIndex >= 0) voiceSelect.value = String(hindiIndex);
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;

  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

function speak(message) {
  answerBox.textContent = message;

  if (!("speechSynthesis" in window)) {
    statusBox.textContent = "इस ब्राउज़र में आवाज़ का समर्थन उपलब्ध नहीं है।";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  console.log("ALIS TEXT:", message);
  const selectedVoice = availableVoices[Number(voiceSelect.value)];

  if (selectedVoice) {
    utterance.voice = selectedVoice;
    utterance.lang = selectedVoice.lang;
  } else {
    utterance.lang = "hi-IN";
  }

  utterance.rate = 0.9;
  utterance.pitch = 1;

  utterance.onstart = () => {
    speaking = true;
    orb.classList.add("speaking");
  };

  
utterance.onend = () => {
  speaking = false;
  orb.classList.remove("speaking");

  if (autoListen && !listening) {
    setTimeout(() => {
      if (autoListen && !speaking && !listening) {
        startListening();
      }
    }, 1000);
  }
};
  

  
utterance.onerror = () => {
  speaking = false;
  orb.classList.remove("speaking");
  statusBox.textContent = "आवाज़ चलाने में समस्या हुई।";

  if (autoListen && !listening) {
    setTimeout(() => {
      if (autoListen && !speaking && !listening) {
        startListening();
      }
    }, 1000);
  }
};
  

  window.speechSynthesis.speak(utterance);
}

previewVoiceBtn.addEventListener("click", () => {
  loadVoices();

  if (!availableVoices.length) {
    statusBox.textContent =
      "आवाज़ उपलब्ध नहीं है। Chrome की आवाज़ सेटिंग जाँचें।";
    return;
  }

  speak("नमस्ते! मैं ALIS हूँ।");
});

function getDayName() {
  return [
    "रविवार", "सोमवार", "मंगलवार", "बुधवार",
    "गुरुवार", "शुक्रवार", "शनिवार"
  ][new Date().getDay()];
}

function getDateText() {
  const now = new Date();
  const months = [
    "जनवरी", "फ़रवरी", "मार्च", "अप्रैल", "मई", "जून",
    "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"
  ];
  return `आज ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} है।`;
}

function calculate(text) {
  let s = text.toLowerCase()
    .replace(/एलिस|alis/gi, "")
    .replace(/कितने होते हैं|कितने होते है|कितना होता है|कितना है/g, "")
    .replace(/जमा|जोड़ो|जोड़|प्लस|plus/g, "+")
    .replace(/घटाओ|घटा|माइनस|minus/g, "-")
    .replace(/गुणा|गुना|into|multiplied by/g, "*")
    .replace(/भाग|बटा|divided by/g, "/")
    .replace(/×|x/g, "*")
    .replace(/÷/g, "/")
    .replace(/पाँच|पांच/g, "5")
    .replace(/शून्य/g, "0")
    .replace(/एक/g, "1")
    .replace(/दो/g, "2")
    .replace(/तीन/g, "3")
    .replace(/चार/g, "4")
    .replace(/छह/g, "6")
    .replace(/सात/g, "7")
    .replace(/आठ/g, "8")
    .replace(/नौ/g, "9")
    .replace(/दस/g, "10")
    .replace(/[?=]/g, " ")
    .trim();

  if (!/^[\d\s.+*/()-]+$/.test(s)) return null;

  const tokens = s.match(/\d+(?:\.\d+)?|[()+*/-]/g);
  if (!tokens || tokens.join("").replace(/\s/g, "") !== s.replace(/\s/g, "")) {
    return null;
  }

  let i = 0;

  function factor() {
    if (tokens[i] === "-") {
      i++;
      return -factor();
    }
    if (tokens[i] === "(") {
      i++;
      const v = expression();
      if (tokens[i++] !== ")") throw Error("गलत गणित");
      return v;
    }
    const v = Number(tokens[i++]);
    if (!Number.isFinite(v)) throw Error("गलत गणित");
    return v;
  }

  function term() {
    let v = factor();
    while (tokens[i] === "*" || tokens[i] === "/") {
      const op = tokens[i++];
      const b = factor();
      if (op === "/" && b === 0) throw Error("शून्य से भाग नहीं दे सकते।");
      v = op === "*" ? v * b : v / b;
    }
    return v;
  }

  function expression() {
    let v = term();
    while (tokens[i] === "+" || tokens[i] === "-") {
      const op = tokens[i++];
      const b = term();
      v = op === "+" ? v + b : v - b;
    }
    return v;
  }

  try {
    const result = expression();
    if (i !== tokens.length || !Number.isFinite(result)) return null;
    return Number(result.toFixed(8)).toString();
  } catch (error) {
    return error.message === "शून्य से भाग नहीं दे सकते।"
      ? error.message : null;
  }
}

let commandMode = false;
let numberMode = false;
let collectedNumber = "";
  
function runCommand(raw) {
  let text = raw.toLowerCase().trim();

  const wakeName = /alis|अलिस|एलिस/i;

  // नंबर लिखने का मोड
  if (numberMode) {
    if (/बस|हो गया|लिखना बंद करो|समाप्त/i.test(text)) {
      numberMode = false;
      speak("सर, आपका नंबर है " + collectedNumber);
      collectedNumber = "";
      return;
    }

    const digitWords = {
      "शून्य": "0", "जीरो": "0",
      "एक": "1", "दो": "2", "तीन": "3",
      "चार": "4", "पाँच": "5", "पांच": "5",
      "छह": "6", "सात": "7", "आठ": "8", "नौ": "9"
    };

    for (const word in digitWords) {
      text = text.replaceAll(word, digitWords[word]);
    }

    text = text.replace(/टू|two|to/gi, "2");
const digits = text.replace(/[^\d]/g, "");

    if (digits.length > 0) {
      collectedNumber += digits;
      speak("हूँ, आगे बताइए।");
    } else {
      speak("सर, कृपया नंबर बताइए।");
    }
    return;
  }

  // ALIS नाम सुनने पर सक्रिय होना
  if (!commandMode) {
    if (!wakeName.test(text)) return;

    text = text
      .replace(/alis|अलिस|एलिस/gi, "")
      .replace(/[,\s]+/g, " ")
      .trim();

    if (!text) {
      commandMode = true;
      speak("हाँ सर, मैं आपकी बात सुन रहा हूँ।");
      return;
    }
  } else {
    text = text
      .replace(/alis|अलिस|एलिस/gi, "")
      .trim();
    commandMode = false;
  }

  // नंबर लिखने का आदेश
  if (text.includes("नंबर लिखो") ||
      text.includes("नंबर लिखना")) {
    numberMode = true;
    collectedNumber = "";
    speak("हाँ सर, मैं लिख रहा हूँ। आप नंबर बताइए।");
    return;
  }
  

  if (text.includes("good morning") || text.includes("गुड मॉर्निंग") ||
      text.includes("सुप्रभात")) {
    speak("गुड मॉर्निंग! बताइए, मैं आपकी क्या मदद करूँ?");
    return;
  }

  if (text.includes("नमस्ते") || text.includes("नमस्कार") ||
      text.includes("hello")) {
    speak("नमस्ते! मैं ALIS हूँ। बताइए, मैं आपकी क्या मदद करूँ?");
    return;
  }

  if (text.includes("तुम्हारा नाम") || text.includes("तुम कौन हो")) {
    speak("मेरा नाम ALIS है।");
    return;
  }

  if (text.includes("क्या कर सकते हो")) {
    speak("मैं समय, तारीख बता सकता हूँ, आसान गणित कर सकता हूँ और Google या YouTube खोल सकता हूँ।");
    return;
  }

  if (text.includes("कौन सा दिन") || text.includes("कौन-सा दिन") ||
      (text.includes("आज कौन") && text.includes("दिन"))) {
    speak("आज " + getDayName() + " है।");
    return;
  }

  if (text.includes("तारीख") || text.includes("date")) {
    speak(getDateText());
    return;
  }

  if (text.includes("समय") || text.includes("कितने बजे") ||
      text.includes("time")) {
    speak("अभी समय है " + new Date().toLocaleTimeString("hi-IN", {
      hour: "numeric", minute: "2-digit"
    }));
    return;
  }

  if (text.includes("गूगल") || text.includes("google")) {
    speak("गूगल खोलने की कोशिश कर रहा हूँ।");
    window.open("https://www.google.com", "_blank");
    return;
  }

  if (text.includes("यूट्यूब") || text.includes("youtube")) {
    speak("यूट्यूब खोलने की कोशिश कर रहा हूँ।");
    window.open("https://www.youtube.com", "_blank");
    return;
  }

  const result = calculate(text);
  if (result !== null) {
    speak("जवाब है " + result);
    return;
  }

  askAlisAI(raw);
}

function startListening() {
  if (!SpeechRecognition) {
    statusBox.textContent =
      "इस ब्राउज़र में आवाज़ पहचान उपलब्ध नहीं है। Chrome में कोशिश करें।";
    return;
  }

  if (listening) {
    statusBox.textContent = "ALIS पहले से सुन रहा है।";
    return;
  }

  try {
    recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      orb.classList.add("listening");
      listenBtn.textContent = "🎙️ सुन रहा हूँ…";
      statusBox.textContent = "ALIS सुन रहा है। अब बोलिए।";
    };

    recognition.onresult = event => {
      const transcript = event.results[0][0].transcript;
      statusBox.textContent = "आपने कहा: " + transcript;
      runCommand(transcript);
    };

    recognition.onerror = event => {
      statusBox.textContent = "माइक्रोफ़ोन/आवाज़ की समस्या: " + event.error;
    };

    
recognition.onend = () => {
  listening = false;
  orb.classList.remove("listening");
  listenBtn.textContent = "🎙️ बोलिए — ALIS सुन रहा है";

  if (autoListen && !speaking) {
    setTimeout(() => {
      if (autoListen && !speaking && !listening) {
        startListening();
      }
    }, 1000);
  }
};
    

    recognition.start();
  } catch (error) {
    listening = false;
    statusBox.textContent = "माइक्रोफ़ोन शुरू नहीं हो पाया। फिर कोशिश करें।";
  }
}
orb.addEventListener("click", () => {
  autoListen = true;
  startListening();
});
listenBtn.addEventListener("click", () => {
  autoListen = true;
  startListening();
});

stopBtn.addEventListener("click", () => {
  autoListen = false;
  if (recognition) {
    try { recognition.abort(); } catch (error) {}
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  listening = false;
  speaking = false;
  orb.classList.remove("listening", "speaking");
  listenBtn.textContent = "🎙️ बोलिए — ALIS सुन रहा है";
  statusBox.textContent = "आवाज़ बंद है।";
});
</script>
</body>
</html>
